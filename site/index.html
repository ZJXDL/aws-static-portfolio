<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A clean, classic game of Minesweeper.">
    <meta name="theme-color" content="#f7f1e7">
    <title>Minesweeper</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#game">Skip to game</a>
    <header class="site-header" id="top">
      <a class="wordmark" href="#top" aria-label="Minefield home">
        <span class="wordmark-mark" aria-hidden="true">✳</span>
        <span>MINEFIELD</span>
      </a>
      <span class="header-tag">CLASSIC</span>
    </header>

    <main>
      <section class="game-shell" id="game" aria-labelledby="page-title">
        <div class="game-heading">
          <div class="title-group">
            <p class="eyebrow">THE CLASSIC</p>
            <h1 id="page-title">Minesweeper<span aria-hidden="true">.</span></h1>
          </div>
          <div class="game-toolbar">
            <label class="level-select" for="difficulty">
              <span>BOARD</span>
              <select id="difficulty" name="difficulty">
                <option value="beginner">Beginner · 9 × 9</option>
                <option value="intermediate">Intermediate · 16 × 16</option>
                <option value="expert">Expert · 16 × 30</option>
              </select>
            </label>
            <button class="new-game" id="new-game" type="button">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16.2 8A6.5 6.5 0 0 0 4.7 5.7L3 7.4M3 3.8v3.7h3.7M3.8 12a6.5 6.5 0 0 0 11.5 2.3L17 12.6m0 3.6v-3.7h-3.7"/></svg>
              <span>New game</span>
            </button>
          </div>
        </div>

        <div class="game-card">
          <div class="scorebar" aria-label="Game status">
            <div class="score">
              <span>MINES</span>
              <strong id="mine-count">010</strong>
            </div>
            <button class="face-button" id="face-button" type="button" aria-label="Start a new game">☺</button>
            <div class="score score-time">
              <span>TIME</span>
              <strong id="timer">000</strong>
            </div>
          </div>

          <div class="board-frame">
            <div class="board-scroll">
              <div class="board" id="board" role="group" aria-label="Minesweeper board"></div>
            </div>
          </div>

          <div class="game-bottom">
            <div class="game-message" id="game-message" role="status" aria-live="polite">Tap a tile to begin.</div>
            <button class="flag-toggle" id="flag-toggle" type="button" aria-pressed="false">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 17V3m.5.5h9l-2.2 3 2.2 3h-9"/></svg>
              <span>Flag</span>
              <kbd>F</kbd>
            </button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
